<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a15">
<title>Jenny &amp; Priyansh · Save the Date</title>
<style>
@font-face{font-family:Invitation;src:url('{{SERIF}}') format('truetype');font-weight:300 700;font-display:block}
@font-face{font-family:Signature;src:url('{{SCRIPT}}') format('truetype');font-display:block}
@font-face{font-family:'Google Sans';src:url('{{GOOGLE400}}') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'Google Sans';src:url('{{GOOGLE500}}') format('truetype');font-weight:500 700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101a15;color:#fff9ea}body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100svh;background:radial-gradient(ellipse at 50% 35%,#28372b,#101a15 75%)}
.viewer{width:min(100%,500px);padding:16px 18px 18px;display:flex;align-items:center;flex-direction:column;gap:13px}
.heading{width:100%;display:flex;justify-content:space-between;align-items:center;color:#d5cdb7;font-size:10px;letter-spacing:2.2px;text-transform:uppercase}.heading span:last-child{font-size:9px;opacity:.55;letter-spacing:1.8px}
.viewport{position:relative;width:min(100%,calc((100svh - 119px)*.5625));aspect-ratio:9/16;overflow:hidden;box-shadow:0 16px 80px #0009;outline:1px solid #c5a66940;background:#9b8668}
#stage{position:absolute;top:0;left:0;width:720px;height:1280px;overflow:hidden;transform-origin:0 0;isolation:isolate}
.scenery{position:absolute;inset:0;background:url('{{ROAD}}') center/720px 1280px no-repeat}
.copy{position:absolute;left:199px;width:332px;text-align:center;color:#fffdf1;font-family:Invitation,Georgia,serif;font-weight:400;font-variant-numeric:lining-nums;z-index:3;opacity:0;will-change:opacity}
#script-mask{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#save-date{position:absolute;left:360px;top:845px;width:740px;margin-left:-370px;height:150px;margin-top:-75px;transform:rotate(90deg);text-align:center;white-space:nowrap;font-family:Signature,cursive;font-size:116px;font-weight:400;line-height:1.3;color:#fffdf1;text-shadow:2px 3px 2px #0005}
#car{position:absolute;left:258px;top:0;width:216px;height:462px;z-index:5;will-change:transform;pointer-events:none}
#date{top:302px;font-size:68px;line-height:.92;letter-spacing:-2px;font-weight:400}#date .day{font-size:65px;white-space:nowrap;letter-spacing:-2.4px}#date .month{font-size:65px}#date .year{font-size:70px}
#message{top:532px;font-family:'Times New Roman',serif;font-style:italic;font-size:23px;line-height:25.5px;font-weight:bold;left:201px;width:326px;letter-spacing:-.3px}
#bride{top:653px;font-size:65px;line-height:1.05;text-transform:uppercase}#amp{top:726px;font-size:65px;line-height:1.05;font-style:italic}#groom{top:799px;font-size:65px;line-height:1.05;text-transform:uppercase;letter-spacing:-1px}
#venue{top:893px;font-size:18.5px;line-height:25px;font-weight:600;letter-spacing:.1px;text-transform:uppercase}#closing{top:970px;font-size:17px;line-height:24px;font-weight:600;white-space:nowrap;letter-spacing:.05px}#heart{top:1015px;font-family:Georgia,serif;font-size:43px;line-height:1}
.copy{font-family:'Google Sans',sans-serif;font-weight:400}
#date{font-weight:400;line-height:1.02}#date .day{font-size:56px;letter-spacing:-2.5px}#date .month{font-size:59px}#date .year{font-size:63px}
#message{font-family:'Google Sans',sans-serif;font-style:normal;font-size:19px;line-height:26px;font-weight:400;letter-spacing:-.55px}
#bride,#groom{font-size:54px;letter-spacing:-1.5px}#amp{font-size:49px;font-style:normal}
#venue{font-size:16px;line-height:24px;font-weight:400;letter-spacing:-.15px}#closing{font-size:14.5px;font-weight:400;letter-spacing:0}
.controls{width:100%;max-width:360px;display:flex;gap:14px;align-items:center;height:30px}button{appearance:none;border:0;background:transparent;color:#eee4cf;cursor:pointer;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;padding:5px;flex-shrink:0}button:hover{background:#ffffff13}button:focus-visible,input:focus-visible{outline:2px solid #d9bd80;outline-offset:4px}button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.progress{flex:1;min-width:30px;accent-color:#d4bc89;height:3px;cursor:pointer}#clock{font-size:9px;font-variant-numeric:tabular-nums;letter-spacing:.6px;color:#b8b09b;min-width:49px;white-space:nowrap}.hint{font-size:9px;color:#a6a38e;letter-spacing:1px;min-height:12px;margin-top:-8px}
body.render{background:none;display:block;min-height:0}.render .viewer{padding:0;width:720px;gap:0}.render .heading,.render .controls,.render .hint{display:none}.render .viewport{width:720px;height:1280px;box-shadow:none;outline:0}
@media(max-width:500px){.viewer{padding:10px 12px 12px;gap:10px}.viewport{width:min(100%,calc((100svh - 105px)*.5625))}.heading{max-width:360px;font-size:9px}.heading span:last-child{font-size:8px}.controls{gap:10px}}
@media(prefers-reduced-motion:reduce){button{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="viewer" aria-label="Jenny and Priyansh animated wedding invitation">
 <header class="heading"><span>Jenny &amp; Priyansh</span><span>Save the date</span></header>
 <div class="viewport" id="viewport" role="img" aria-label="A red floral convertible travels down a palm-lined road, revealing Jenny and Priyansh's wedding invitation.">
  <div id="stage">
   <div class="scenery"></div>
   <div id="script-mask"><div id="save-date"><span id="save-word">Save </span>the date</div></div>
   <div id="date" class="copy"><div class="day" data-field="days">15TH–16TH</div><div class="month" data-field="month">FEB</div><div class="year" data-field="year">2026</div></div>
   <div id="message" class="copy">With love in our hearts and our<br>favourite people by our side,<br>we’re ready to celebrate!</div>
   <div id="bride" class="copy" data-field="bride">Jenny</div>
   <div id="amp" class="copy">&amp;</div>
   <div id="groom" class="copy" data-field="groom">Priyansh</div>
   <div id="venue" class="copy"><span data-field="venue">Arawali Ananta Elite</span><br><span data-field="location">Ranakpur, Rajasthan</span></div>
   <div id="closing" class="copy">FORMAL INVITATION TO FOLLOW</div>
   <div id="heart" class="copy" aria-hidden="true">♥</div>
   <img id="car" src="{{CAR}}" alt="Illustrated couple in a red floral vintage convertible" width="216" height="462">
  </div>
 </div>
 <div class="controls" aria-label="Playback controls">
  <button id="play" aria-label="Pause invitation" title="Play / Pause (Space)"><svg viewBox="0 0 24 24"><path id="play-icon" d="M9 5v14M15 5v14"/></svg></button>
  <button id="replay" aria-label="Replay from beginning" title="Replay"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 3v6h6"/></svg></button>
  <input class="progress" id="progress" type="range" min="0" max="11.533333" step="0.01" value="0" aria-label="Invitation timeline">
  <span id="clock">0:00 / 0:12</span>
  <button id="sound" aria-label="Turn music on" title="Music on / off"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4V4"/><path id="sound-icon" d="m16 9 5 6m0-6-5 6"/></svg></button>
 </div>
 <div class="hint" id="hint">Tap the speaker for music</div>
</main>
<audio id="music" preload="auto" src="{{AUDIO}}"></audio>
<script>
// EDIT THESE DETAILS to personalise this invitation. The scenery and text remain separate layers.
const DETAILS = {
 bride: 'Jenny', groom: 'Priyansh', days: '15TH–16TH', month: 'FEB', year: '2026',
 venue: 'Arawali Ananta Elite', location: 'Ranakpur, Rajasthan'
};
const DURATION=346/30;
document.querySelectorAll('[data-field]').forEach(el=>el.textContent=DETAILS[el.dataset.field]);
document.title=`${DETAILS.bride} & ${DETAILS.groom} · Save the Date`;
const stage=document.getElementById('stage'), viewport=document.getElementById('viewport'),
 music=document.getElementById('music'), progress=document.getElementById('progress'),
 play=document.getElementById('play'), car=document.getElementById('car');
const fade=(t,start,len=.65)=>Math.max(0,Math.min(1,(t-start)/len));
const cue=[['date',3.50,.65],['message',5.30,.60],['bride',6.0,.65],['amp',6.8,.55],['groom',7.40,.65],['venue',8.1,.65],['closing',8.8,.65],['heart',9.5,.60]];
let time=0,playing=false,sound=false,previous=null;
function resize(){stage.style.transform=`scale(${viewport.getBoundingClientRect().width/720})`}
new ResizeObserver(resize).observe(viewport);
function draw(t){
 time=Math.max(0,Math.min(DURATION,t));
 const y=-43+125*time;
 car.style.transform=`translate3d(0,${y}px,0)`;
 const script=document.getElementById('script-mask');
 script.style.clipPath=`inset(${Math.max(0,y+466)}px 0px 0px 0px)`;
 script.style.opacity=fade(time,0,.24)*(1-fade(time,4.2,.9));
 document.getElementById('save-word').style.opacity=1-fade(time,.28,.6);
 cue.forEach(([id,start,len])=>document.getElementById(id).style.opacity=fade(time,start,len));
 progress.value=time;
 document.getElementById('clock').textContent=`0:${String(Math.floor(time)).padStart(2,'0')} / 0:12`;
}
function syncAudio(){if(sound){music.currentTime=Math.min(time,music.duration||DURATION);if(playing)music.play().catch(()=>{document.getElementById('hint').textContent='Tap the speaker to start music'})}}
function updateButton(){play.setAttribute('aria-label',playing?'Pause invitation':'Play invitation');document.getElementById('play-icon').setAttribute('d',playing?'M9 5v14M15 5v14':'m8 4 12 8-12 8Z')}
function setPlaying(value){playing=value;previous=null;updateButton();if(playing)syncAudio();else music.pause()}
function seek(t){draw(t);previous=null;syncAudio()}
function tick(now){if(playing){if(previous!==null)draw(time+(now-previous)/1000);previous=now;if(time>=DURATION)setPlaying(false)}requestAnimationFrame(tick)}
play.addEventListener('click',()=>{if(time>=DURATION)seek(0);setPlaying(!playing)});
document.getElementById('replay').addEventListener('click',()=>{seek(0);setPlaying(true)});
progress.addEventListener('input',()=>seek(Number(progress.value)));
document.getElementById('sound').addEventListener('click',()=>{sound=!sound;music.muted=!sound;document.getElementById('sound-icon').setAttribute('d',sound?'M16 7q7 5 0 10M16 10q3 2 0 4':'m16 9 5 6m0-6-5 6');document.getElementById('sound').setAttribute('aria-label',sound?'Turn music off':'Turn music on');document.getElementById('hint').textContent=sound?'Jenny & Priyansh · 15–16 February 2026':'Tap the speaker for music';if(sound)syncAudio();else music.pause()});
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();play.click()}if(e.code==='ArrowRight')seek(time+.5);if(e.code==='ArrowLeft')seek(time-.5)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false)});
window.__getDuration=()=>DURATION;
window.__seekTo=t=>{setPlaying(false);draw(t)};
window.__invite={details:DETAILS,duration:DURATION,seek:window.__seekTo,play:()=>setPlaying(true),pause:()=>setPlaying(false)};
const params=new URLSearchParams(location.search);
if(params.has('render')){document.body.classList.add('render');draw(Number(params.get('t'))||0)}else{draw(0);if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw(DURATION);else setPlaying(true)}
resize();requestAnimationFrame(tick);
</script>
</body>
</html>
