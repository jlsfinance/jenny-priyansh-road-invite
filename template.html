.controls{width:100%;max-width:370px;height:27px;display:flex;align-items:center;gap:12px}button{appearance:none;background:transparent;border:0;color:#6c5942;border-radius:30px;cursor:pointer;min-width:29px;height:29px;padding:5px;display:grid;place-items:center}button:hover{background:#9d8b6c18}button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}button:focus-visible,input:focus-visible{outline:2px solid #9b8260;outline-offset:3px}#progress{height:3px;flex:1;min-width:30px;accent-color:#9e8765;cursor:pointer}#clock{font:9px system-ui,sans-serif;color:#8d806b;white-space:nowrap}.hint{font:9px system-ui,sans-serif;letter-spacing:1px;color:#948771;min-height:11px}

@media(max-width:500px){.viewer{padding:10px;gap:9px}.heading{max-width:360px;font-size:8px;letter-spacing:1.5px}.heading small{font-size:7px}.viewport{width:min(100%,calc((100svh - 100px)*.5625))}.controls{gap:9px}}
@media(max-width:500px){
 html{overflow-x:hidden}body{min-height:100dvh}
 .viewer{width:100%;max-width:480px;min-height:100dvh;justify-content:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
 .viewport{flex-shrink:0;width:min(100%,calc((100dvh - 102px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.5625))}

</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="jp-ink" color-interpolation-filters="sRGB"><feColorMatrix in="SourceGraphic" type="matrix" values="0 0 0 0 .24 0 0 0 0 .15 0 0 0 0 .10 -.333 -.333 -.333 0 1" result="ink"/><feComponentTransfer in="ink" result="bold"><feFuncA type="linear" slope="1.7"/></feComponentTransfer><feComposite in="bold" in2="SourceAlpha" operator="in"/></filter></defs></svg>
<main class="viewer"><header class="heading"><span>Jenny &amp; Priyansh</span><small>Save the date</small></header>
<div id="viewport" class="viewport" role="img" aria-label="Jenny and Priyansh's animated save-the-date invitation, 16 February 2026, Arawali Ananta Elite, Ranakpur."><div id="stage">
 <div class="paper"></div>
 <video id="couple" class="motion" src="assets/personalized-couple.mp4" data-start="0" data-end="14" preload="auto" muted playsinline disablepictureinpicture aria-label="Jenny and Priyansh photo-based faces on the reference's moving caricature bodies"></video>
 <img id="crest" src="assets/logo-crest.webp" alt="Jenny and Priyansh wedding crest"><div id="names">Jenny &amp; Priyansh</div>
 <div id="everyone" class="message"><span id="everyone-one" class="text-line"></span><span id="everyone-two" class="text-line"></span></div>
 <div id="turn" class="message"></div>

 <video id="bird-left" class="motion bird" src="assets/bird-left.mp4" data-start="8.6" data-end="14" preload="auto" muted playsinline disablepictureinpicture aria-hidden="true"></video><video id="bird-right" class="motion bird" src="assets/bird-right.mp4" data-start="8.6" data-end="14" preload="auto" muted playsinline disablepictureinpicture aria-hidden="true"></video>
 <div id="save-date"><span>SAVE</span><em>the</em><span>DATE</span></div>
 <div id="month" aria-label="February 2026"></div>
 <div id="day-heart"><svg viewBox="0 0 106 76" aria-hidden="true"><defs><radialGradient id="pink" cx="35%" cy="25%" r="80%"><stop stop-color="#ffd7dc"/><stop offset=".62" stop-color="#f4b4c0"/><stop offset="1" stop-color="#e79daa"/></radialGradient></defs><path d="M53 72C40 62 6 45 6 22C6 0 36-5 53 14C70-5 100 0 100 22C100 45 67 63 53 72Z" fill="url(#pink)" stroke="#eeb2bf" stroke-width="1.5"/><path d="M17 21C20 9 35 8 41 15" fill="none" stroke="#fff0f0" stroke-width="4" opacity=".7"/></svg><span id="day">16</span></div>
 <div id="venue">Arawali Ananta Elite · Ranakpur</div>

</div></div>
<div class="controls"><button id="play" aria-label="Pause invitation" title="Play / Pause"><svg viewBox="0 0 24 24"><path id="play-icon" d="M9 5v14M15 5v14"/></svg></button><button id="replay" aria-label="Replay invitation" title="Replay"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 3v6h6"/></svg></button><input id="progress" type="range" min="0" max="14" step="0.01" value="0" aria-label="Invitation timeline"><span id="clock">0:00 / 0:14</span><button id="sound" aria-label="Turn music on" title="Music"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4V4"/><path id="sound-icon" d="m16 9 5 6m0-6-5 6"/></svg></button></div>
<div id="hint" class="hint">Tap the speaker for music</div>
</main><audio id="music" src="assets/reference-music.mp3" preload="auto"></audio>
<script>
const DETAILS={bride:'Jenny',groom:'Priyansh',month:'FEBRUARY 2026',day:16,venue:'Arawali Ananta Elite · Ranakpur'};
const DUR=14,FPS=30,$=id=>document.getElementById(id),clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),fade=(t,s,d=.5)=>clamp((t-s)/d),smooth=p=>p*p*(3-2*p),opacity=(id,a)=>$(id).style.opacity=clamp(a);
$('names').textContent=`${DETAILS.bride} & ${DETAILS.groom}`;$('venue').textContent=DETAILS.venue;const letters=[...DETAILS.month].map((c,i)=>{const e=document.createElement('span');e.className='letter';e.textContent=c;$('month').appendChild(e);return e});
const videos=[...document.querySelectorAll('.motion')],music=$('music'),progress=$('progress');let time=0,playing=false,sound=false,last=null;
function syncVideos(t){for(const v of videos){v.muted=true;const start=Number(v.dataset.start),end=Number(v.dataset.end),active=t>=start&&t<end;if(v.id!=='couple')v.style.opacity=active?'1':'0';if(v.readyState<1)continue;const target=clamp(t-start,0,Math.max(0,v.duration-1/FPS));if(!playing||!active){if(!v.paused)v.pause();if(Math.abs(v.currentTime-target)>.01)v.currentTime=target}else{if(Math.abs(v.currentTime-target)>.16)v.currentTime=target;if(v.paused&&!v.ended)v.play().catch(()=>{})}}}
videos.forEach(v=>v.addEventListener('loadedmetadata',()=>syncVideos(time)));
function typed(text,t,start,duration){return text.slice(0,Math.floor(fade(t,start,duration)*(text.length+1)))}
function draw(t){time=clamp(t,0,DUR);opacity('crest',fade(time,.35,.8));opacity('names',fade(time,.9,.8));$('everyone-one').textContent=typed('EVERYONE',time,2.0,.55);$('everyone-two').textContent=typed('IS GETTING MARRIED',time,2.6,1.0);opacity('everyone',1-fade(time,4.15,.5));$('turn').textContent=typed("NOW IT’S OUR TURN...",time,4.43,.77);opacity('turn',1-fade(time,6.1,.3));opacity('save-date',fade(time,8.633,1.1));letters.forEach((e,i)=>{const p=fade(time,10.08+i*.055,.42);e.style.opacity=p;e.style.transform=`translate(${Math.sin(i*7)*(1-smooth(p))*22}px,${(i%2?18:-20)*(1-smooth(p))}px) rotate(${(i%2?-9:9)*(1-p)}deg)`});const hp=fade(time,10.45,.6);opacity('day-heart',hp);$('day-heart').style.transform=`scale(${.7+.3*smooth(hp)})`;$('day').textContent=time<11.45?Math.min(DETAILS.day,3+Math.floor(Math.max(0,time-10.8)*20)):DETAILS.day;opacity('venue',fade(time,11.7,.7));progress.value=time;$('clock').textContent=`0:${String(Math.floor(time)).padStart(2,'0')} / 0:14`;syncVideos(time)}
function resize(){$('stage').style.transform=`scale(${$('viewport').getBoundingClientRect().width/720})`}new ResizeObserver(resize).observe($('viewport'));
function syncAudio(){if(sound){music.currentTime=Math.min(time,music.duration||DUR);if(playing)music.play().catch(()=>{$('hint').textContent='Tap the speaker to start music'})}}
function setPlaying(value){playing=value;last=null;$('play-icon').setAttribute('d',playing?'M9 5v14M15 5v14':'m8 4 12 8-12 8Z');$('play').setAttribute('aria-label',playing?'Pause invitation':'Play invitation');if(playing)syncAudio();else music.pause();syncVideos(time)}
function seek(t){draw(t);last=null;syncAudio()}
function tick(now){if(playing){if(last!==null)draw(time+(now-last)/1000);last=now;if(time>=DUR)setPlaying(false)}requestAnimationFrame(tick)}
$('play').onclick=()=>{if(time>=DUR)seek(0);setPlaying(!playing)};$('replay').onclick=()=>{seek(0);setPlaying(true)};progress.oninput=()=>seek(Number(progress.value));$('sound').onclick=()=>{sound=!sound;music.muted=!sound;$('sound-icon').setAttribute('d',sound?'M16 7q7 5 0 10M16 10q3 2 0 4':'m16 9 5 6m0-6-5 6');$('sound').setAttribute('aria-label',sound?'Turn music off':'Turn music on');$('hint').textContent=sound?'Jenny & Priyansh · 16 February 2026':'Tap the speaker for music';if(sound)syncAudio();else music.pause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false)});document.onkeydown=e=>{if(e.target.matches('button,input'))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowRight')seek(time+.1);if(e.code==='ArrowLeft')seek(time-.1)};
window.__getDuration=()=>DUR;window.__seekTo=async t=>{setPlaying(false);draw(t);await Promise.all(videos.map(v=>new Promise(resolve=>{if(v.readyState>=2&&!v.seeking){resolve();return}v.addEventListener('seeked',resolve,{once:true});v.addEventListener('loadeddata',resolve,{once:true});setTimeout(resolve,3000)})))};window.__invite={details:DETAILS,play:()=>setPlaying(true),pause:()=>setPlaying(false),seek:window.__seekTo,duration:DUR};
const params=new URLSearchParams(location.search);if(params.has('render')){document.body.classList.add('render');draw(Number(params.get('t'))||0)}else{draw(0);if(matchMedia('(prefers-reduced-motion:reduce)').matches)draw(13);else setPlaying(true)}resize();requestAnimationFrame(tick);
</script></body></html>
