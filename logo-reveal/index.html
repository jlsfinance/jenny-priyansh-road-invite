<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170f13">
  <title>Jenny &amp; Priyansh | Wedding Logo Reveal</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #170f13;
      color: #f7e8d5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      justify-items: center;
      align-content: center;
      padding: 16px 12px;
    }

    .player { width: min(100%, 620px, max(250px, calc((100svh - 115px) * .8))); }
    .stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      container-type: inline-size;
      aspect-ratio: 4 / 5;
      background: #050404;
      box-shadow: 0 12px 42px #08040699;
    }

    .scene { position: absolute; inset: 0; overflow: hidden; }
    .scene[hidden] { display: none; }
    .venue {
      position: absolute;
      display: block;
      top: -69%;
      left: 0;
      width: 145%;
      height: auto;
      max-width: none;
      transform: translateX(-28%);
      filter: sepia(.34) saturate(.78) brightness(.85);
    }

    .grade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 44%, transparent 12%, #240d2170 100%),
        linear-gradient(180deg, #6e3941b0 0%, #672f24a1 37%, #592619d9 100%);
    }

    .monogram {
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: sepia(.58) saturate(.84) hue-rotate(-11deg) brightness(.98)
        drop-shadow(0 2px 5px #35171067);
    }

    .mark, .sprig, .mark img {
      position: absolute;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    .mark {
      top: 21.8%;
      left: 50%;
      width: 49%;
      aspect-ratio: 237 / 274;
      transform: translateX(-50%);
    }

    .mark img {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .mark img[hidden] { display: none; }
    .letter { opacity: 0; }
    .letter-j { transform-origin: 32% 34%; }
    .letter-p { transform-origin: 62% 68%; }

    .sprig {
      opacity: 0;
      clip-path: inset(100% 0 0);
    }

    .sprig-left {
      top: 34%;
      left: 24.8%;
      width: 10%;
      transform-origin: 91% 95%;
    }

    .sprig-right {
      top: 36%;
      right: 24.9%;
      width: 9.4%;
      transform-origin: 8% 94%;
    }

    .title {
      position: absolute;
      top: 74.15%;
      left: 8%;
      width: 84%;
      text-align: center;
      color: #fff0da;
      text-shadow: 0 2px 9px #32130e;
    }

    h1 {
      display: flex;
      gap: 1.45cqw;
      align-items: center;
      justify-content: center;
      margin: 0;
      white-space: nowrap;
      font: 400 5.1cqw/1.14 Baskerville, "Baskerville Old Face", "Times New Roman", serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1::before, h1::after {
      content: "";
      width: 9.6cqw;
      height: 1px;
      background: #f8e1c9d4;
    }

    .subtitle {
      margin: .62cqw 0 0;
      font: 400 6.35cqw/.99 "French Script MT", "Segoe Script", Georgia, cursive;
    }

    .controls {
      display: grid;
      grid-template-columns: auto auto auto minmax(24px, 1fr) auto;
      gap: 5px;
      align-items: center;
      padding-top: 10px;
    }

    button {
      font: inherit;
      border: 1px solid #65494a;
      color: inherit;
      background: #2c1d22;
      border-radius: 6px;
      min-height: 38px;
      padding: 0 9px;
      cursor: pointer;
    }

    button:hover { background: #463038; }
    button:focus-visible, input:focus-visible { outline: 2px solid #edbbaf; outline-offset: 3px; }
    #play { min-width: 66px; font-size: .8rem; }
    input { width: 100%; margin: 0; min-height: 38px; accent-color: #e4a5a1; cursor: pointer; }
    output { color: #ddc1b6; font-size: .72rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
</head>

        <div class="title">
          <h1>Jenny &amp; Priyansh</h1>
          <p class="subtitle">wedding monogram</p>
        </div>
      </div>
    </div>
    <div class="controls" role="group" aria-label="Playback controls">
      <button id="play" type="button">Play</button>
      <button id="previous" type="button" aria-label="Previous frame" title="Previous frame">‹</button>
      <button id="next" type="button" aria-label="Next frame" title="Next frame">›</button>
      <input id="scrubber" type="range" min="0" max="350" value="0" step="1" aria-label="Frame">
      <output id="counter" for="scrubber">0 / 350</output>
    </div>
  </main>
  <script>
    const fps = 2997 / 125;
    const frameCount = 351;
    const cutFrame = 2;
    const lastFrame = frameCount - 1;
    const scene = document.getElementById("scene");
    const venue = document.getElementById("venue");
    const letterJ = document.getElementById("letter-j");
    const letterP = document.getElementById("letter-p");
    const markStill = document.getElementById("mark-still");
    const lettersSettleFrame = 24;
    const leftSprig = document.getElementById("left-sprig");
    const rightSprig = document.getElementById("right-sprig");
    const playButton = document.getElementById("play");
    const scrubber = document.getElementById("scrubber");
    const counter = document.getElementById("counter");

    let frame = 0;
    let playing = false;
    let interacted = false;
    let animationRequest = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(value, max));
    }

    function openingProgress(first, last) {
      const progress = clamp((frame - first) / (last - first), 0, 1);
      return 1 - (1 - progress) ** 2;
    }

    function openSprig(node, first, last, angle) {
      const growth = openingProgress(first, last);
      node.style.opacity = Math.min(1, growth * 2.6);
      node.style.clipPath = `inset(${(1 - growth) * 88}% 0 0)`;
      node.style.transform = `rotate(${angle * (1 - growth)}deg) scale(${.62 + .38 * growth})`;
    }

    function animateLetters() {
      const settled = frame >= lettersSettleFrame;
      letterJ.hidden = settled;
      letterP.hidden = settled;
      markStill.hidden = !settled;
      if (settled) return;

      const j = openingProgress(cutFrame, 13);
      letterJ.style.opacity = .4 + .6 * j;
      letterJ.style.transform = `translate(${-4 * (1 - j)}%, ${-2.8 * (1 - j)}%) rotate(${-5 * (1 - j)}deg) scale(${.94 + .06 * j})`;
      letterJ.style.clipPath = `inset(0 0 ${56 * (1 - j)}% 0)`;

      const p = openingProgress(7, lettersSettleFrame);
      letterP.style.opacity = p;
      letterP.style.transform = `translate(${4.5 * (1 - p)}%, ${4 * (1 - p)}%) rotate(${5 * (1 - p)}deg) scale(${.93 + .07 * p})`;
      letterP.style.clipPath = `inset(0 0 0 ${73 * (1 - p)}%)`;
    }

    function showFrame(requestedFrame) {
      frame = clamp(Math.round(requestedFrame), 0, lastFrame);
      scene.hidden = frame < cutFrame;
      if (!scene.hidden) {
        const pan = (frame - cutFrame) / (lastFrame - cutFrame);
        venue.style.transform = `translateX(${-28 + 27 * pan}%)`;
        animateLetters();
        openSprig(leftSprig, 8, 17, 16);
        openSprig(rightSprig, 14, 23, -14);
      }
      scrubber.value = frame;
      scrubber.setAttribute("aria-valuetext", `Frame ${frame} of ${lastFrame}`);
      counter.value = `${frame} / ${lastFrame}`;
    }

    function pause() {
      playing = false;
      cancelAnimationFrame(animationRequest);
      playButton.textContent = frame === lastFrame ? "Replay" : "Play";
    }

    function play() {
      if (frame === lastFrame) showFrame(0);
      playing = true;
      playButton.textContent = "Pause";
      const origin = performance.now() - frame * 1000 / fps;

      function tick(now) {
        const nextFrame = Math.floor((now - origin) * fps / 1000);
        if (nextFrame !== frame) showFrame(nextFrame);
        if (nextFrame >= frameCount) pause();
        else animationRequest = requestAnimationFrame(tick);
      }

      animationRequest = requestAnimationFrame(tick);
    }

    function seekFrame(requestedFrame) {
      interacted = true;
      showFrame(requestedFrame);
      pause();
    }

    playButton.addEventListener("click", () => {
      interacted = true;
      if (playing) pause();
      else play();
    });
    scrubber.addEventListener("input", () => seekFrame(scrubber.valueAsNumber));
    document.getElementById("previous").addEventListener("click", () => seekFrame(frame - 1));
    document.getElementById("next").addEventListener("click", () => seekFrame(frame + 1));

    async function startPreview() {
      const images = [...scene.querySelectorAll("img")];
      await Promise.allSettled(images.map(image => image.decode()));
      if (interacted || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      play();
    }

    showFrame(0);
    startPreview();
  </script>
